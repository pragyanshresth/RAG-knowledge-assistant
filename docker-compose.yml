services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qdrant_data:/qdrant/storage]
  backend:
    build: {context: ., dockerfile: app/backend/Dockerfile}
    env_file: .env
    environment: {QDRANT_URL: "http://qdrant:6333"}
    volumes: ["./data:/srv/data"]
    ports: ["8000:8000"]
    depends_on: [qdrant]
  frontend:
    build: {context: app/frontend, args: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: {qdrant_data: {}}
